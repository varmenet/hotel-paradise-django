<h1>Clientes</h1>
{% include "clientes/_mensajes.html" %}

<form method="get">
  <input type="text" name="q" value="{{ q }}" placeholder="Buscar por nombre o correo">
  <button type="submit">Buscar</button>
  <a href="{% url 'clientes:lista' %}">Limpiar</a>
</form>

<p><a href="{% url 'clientes:crear' %}">Nuevo cliente</a></p>

<table border="1">
  <tr>
    <th>Nombre</th><th>Apellidos</th><th>Correo</th><th>Teléfono</th><th>Registro</th><th>Acciones</th>
  </tr>
  {% for c in clientes %}
  <tr>
    <td>{{ c.nombre }}</td>
    <td>{{ c.apellidos }}</td>
    <td>{{ c.correo }}</td>
    <td>{{ c.telefono }}</td>
    <td>{{ c.fecha_registro }}</td>
    <td>
      <a href="{% url 'clientes:detalle' c.pk %}">Ver</a>
      <a href="{% url 'clientes:editar' c.pk %}">Editar</a>
      <a href="{% url 'clientes:eliminar' c.pk %}">Eliminar</a>
    </td>
  </tr>
  {% empty %}
  <tr><td colspan="6">No hay clientes.</td></tr>
  {% endfor %}
</table>
