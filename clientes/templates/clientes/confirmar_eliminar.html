{% extends "base.html" %}
{% block title %}Eliminar cliente{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body text-center">
        <h3 class="card-title mb-3">Eliminar cliente</h3>
        <p>¿Seguro que deseas eliminar a {{ cliente }} ({{ cliente.correo }})?</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Sí, eliminar</button>
          <a href="{% url 'clientes:lista' %}" class="btn btn-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
