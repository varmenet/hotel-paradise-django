{% extends "base.html" %}
{% block title %}Editar habitación {{ habitacion.numero }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-3">Editar habitación {{ habitacion.numero }}</h3>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.as_p }}
          {% if habitacion.imagen %}
            <p class="mb-1">Imagen actual:</p>
            <img src="{{ habitacion.imagen.url }}" alt="Habitación {{ habitacion.numero }}" width="150" class="rounded mb-3">
          {% endif %}
          <div>
            <button type="submit" class="btn btn-primary">Actualizar</button>
            <a href="{% url 'lista_habitaciones' %}" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
