{% extends "base.html" %}
{% block title %}Eliminar habitación{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body text-center">
        <h3 class="card-title mb-3">¿Eliminar habitación {{ habitacion.numero }}?</h3>
        <p>Estás a punto de eliminar la habitación <strong>{{ habitacion.numero }}</strong>. Esta acción no se puede deshacer.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Sí, eliminar</button>
          <a href="{% url 'lista_habitaciones' %}" class="btn btn-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
